<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="yaku-session" content="__YAKU_SESSION_TOKEN__">
  <title>翻訳を始める - YakuLingo</title>
  <link rel="stylesheet" href="/assets/home.css">
  <script src="/assets/common.js" defer></script>
</head>
<body class="yaku-home">
  <header class="home-topbar">
    <a class="home-brand" href="/" aria-label="YakuLingoの入口へ戻る">
      <span class="home-logo" aria-hidden="true">Y</span>
      <span><strong>YakuLingo</strong><small>用途に合う翻訳を選ぶ</small></span>
    </a>
    <nav class="home-utility" aria-label="補助メニュー">
      <a href="/cat?import=1">過去訳を登録</a>
      <a href="/cat?view=work">作業一覧</a>
    </nav>
  </header>

  <main class="home-choices" aria-label="翻訳方法を選ぶ">
    <h1 class="home-visually-hidden">翻訳方法を選ぶ</h1>
    <a class="home-choice home-choice-chat" href="/palette" id="home-chat-entry">
      <span class="home-choice-glow" aria-hidden="true"></span>
      <span class="home-choice-inner">
        <span class="home-kicker">おすすめ・ファイル不要</span>
        <span class="home-choice-icon home-chat-icon" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="home-choice-copy">
          <strong class="home-choice-title">文章をすぐ訳す</strong>
          <span class="home-choice-description">文章を貼り付けるだけ。メール、チャット、短い資料を、その場ですぐに翻訳します。</span>
        </span>
        <span class="home-choice-action">チャット翻訳を開く <b aria-hidden="true">→</b></span>
      </span>
    </a>

    <a class="home-choice home-choice-excel" href="/cat" id="home-excel-entry">
      <span class="home-choice-inner">
        <span class="home-kicker">レイアウトを保って仕上げる</span>
        <span class="home-choice-icon home-excel-icon" aria-hidden="true">XLS</span>
        <span class="home-choice-copy">
          <strong class="home-choice-title">Excelを翻訳する</strong>
          <span class="home-choice-description">表やセル幅を見ながら翻訳し、元のレイアウトを保ったExcelファイルを作ります。</span>
        </span>
        <span class="home-choice-action">Excel翻訳を開く <b aria-hidden="true">→</b></span>
      </span>
    </a>
  </main>
</body>
</html>
