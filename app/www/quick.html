<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="yaku-session" content="__YAKU_SESSION_TOKEN__">
  <meta name="yaku-max-batch-chars" content="__YAKU_MAX_BATCH_CHARS__">
  <title>テキスト翻訳 - YakuLingo</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/quick-page.css">
  <script src="/assets/common.js" defer></script>
  <script src="/assets/quick-page.js" defer></script>
</head>
<body class="app-quick">
  <header class="quick-topbar">
    <a class="quick-brand" href="/quick" aria-label="YakuLingo テキスト翻訳">
      <span aria-hidden="true">Y</span><strong>YakuLingo</strong>
    </a>
    <nav class="quick-mode-nav" aria-label="翻訳モード">
      <a href="/quick" aria-current="page">テキスト翻訳</a>
      <a href="/cat">Excel翻訳</a>
    </nav>
    <div class="quick-copilot">
      <div id="copilot-status" class="status" aria-live="polite"><span class="status-dot warn"></span><span>準備しています</span></div>
      <button id="copilot-window-open" type="button" class="quick-link-button">Copilot画面を開く</button>
      <button id="copilot-prepare-retry" type="button" class="quick-link-button" hidden>準備し直す</button>
    </div>
  </header>
  <p id="copilot-status-detail" class="quick-copilot-detail" role="status" aria-live="polite" hidden></p>

  <main class="quick-main">
    <div id="quick-handoff-note" class="quick-handoff-note" hidden>
      <strong>Excelから引き継ぎました</strong><span id="quick-handoff-cell"></span>
    </div>
    <form id="quick-page-form" class="quick-translator">
      <div class="quick-language-bar" aria-label="翻訳する言語">
        <label for="quick-page-direction"><span>原文言語</span>
          <select id="quick-page-direction" aria-label="原文と訳文の言語">
            <option value="auto">自動判定</option>
            <option value="to_en">日本語 → 英語</option>
            <option value="to_jp">英語・その他 → 日本語</option>
          </select>
        </label>
        <button id="quick-page-swap" type="button" class="quick-swap-button" aria-label="翻訳方向を入れ替える">入れ替え</button>
        <div class="quick-target-language"><span>訳文言語</span><strong id="quick-target-language">自動判定後に決定</strong></div>
      </div>

      <div class="quick-panes">
        <section class="quick-pane quick-source-pane" aria-labelledby="quick-source-title">
          <div class="quick-pane-head">
            <label id="quick-source-title" for="quick-page-input">原文</label>
            <button id="quick-page-clear" type="button" class="quick-ghost-button" disabled>消去</button>
          </div>
          <textarea id="quick-page-input" rows="14" placeholder="翻訳する文章を入力してください" spellcheck="true" autocomplete="off"></textarea>
          <div class="quick-pane-foot"><span id="quick-page-count">0字</span><span id="quick-page-limit" role="status"></span></div>
        </section>

        <section class="quick-pane quick-target-pane" aria-labelledby="quick-target-title">
          <div class="quick-pane-head">
            <span id="quick-target-title">訳文</span>
            <label class="quick-target-control">目標 <input id="quick-target-chars" type="number" min="1" max="3000" inputmode="numeric" placeholder="文字数"> 文字</label>
            <button id="quick-page-copy" type="button" class="quick-secondary-button" disabled>コピー</button>
          </div>
          <div id="quick-variants" class="quick-variants" aria-label="翻訳案" hidden></div>
          <div class="quick-output-wrap">
            <textarea id="quick-page-output" rows="14" readonly placeholder="訳文がここに表示されます"></textarea>
            <div id="quick-page-progress" class="quick-progress" role="status" aria-live="polite" hidden></div>
          </div>
          <div id="quick-result-meta" class="quick-result-meta" hidden><span id="quick-result-count"></span></div>
          <div id="quick-rewrite-actions" class="quick-rewrite-actions" aria-label="訳文を調整" hidden>
            <button type="button" class="quick-secondary-button" data-quick-chip="shorten">短くする</button>
            <button type="button" class="quick-secondary-button" data-quick-chip="shorter">さらに短く</button>
            <button type="button" class="quick-secondary-button" data-quick-chip="rephrase">意味を保って言い換える</button>
            <button type="button" class="quick-secondary-button" data-quick-chip="heading">見出し向け</button>
            <button type="button" class="quick-secondary-button" data-quick-chip="table">表・セル向け</button>
            <button id="quick-page-undo" type="button" class="quick-ghost-button" disabled>直前の案へ戻す</button>
          </div>
          <div class="quick-pane-foot quick-target-foot">
            <span id="quick-page-status" role="status" aria-live="polite"></span>
            <button id="quick-page-return" type="button" class="quick-secondary-button" hidden>Excel作業へ戻す</button>
          </div>
        </section>
      </div>

      <div class="quick-submit-row">
        <div class="quick-speed-controls"><label><input id="quick-auto-translate" type="checkbox"> 入力停止後に自動翻訳</label><span id="quick-page-direction-note" role="status">翻訳方向は自動で判定します</span></div>
        <div class="quick-submit-actions">
          <button id="quick-page-cancel" type="button" class="quick-ghost-button" hidden>中止</button>
          <button id="quick-page-retry" type="button" class="quick-secondary-button" hidden>再試行</button>
          <button id="quick-page-submit" type="submit" class="quick-primary-button" disabled>翻訳</button>
        </div>
      </div>
    </form>
    <div id="quick-shortcuts" class="quick-shortcuts" role="dialog" aria-modal="true" aria-labelledby="quick-shortcuts-title" hidden><div><button type="button" data-close-shortcuts aria-label="閉じる">×</button><h2 id="quick-shortcuts-title">キーボード操作</h2><dl><dt>Ctrl+Enter</dt><dd>翻訳</dd><dt>Ctrl+↑ / ↓</dt><dd>長さを切り替え</dd><dt>Ctrl+1〜5</dt><dd>候補を直接選択</dd><dt>Ctrl+Shift+C</dt><dd>訳文をコピー</dd><dt>Ctrl+Z</dt><dd>直前の案へ戻す</dd><dt>?</dt><dd>この一覧を表示</dd></dl></div></div>
    <details class="quick-abbreviation-settings"><summary>略語辞書</summary><div class="quick-abbreviation-panel"><label><input id="quick-abbreviations-enabled" type="checkbox"> 自分の略語辞書を短い案へ適用する</label><p>1行に「元の語 = 略語」。既定ではオフです。ここで保存した内容だけを決定的に置換します。</p><textarea id="quick-abbreviations-editor" rows="7" spellcheck="false" placeholder="operating income = OP"></textarea><div><span id="quick-abbreviations-status" role="status"></span><button id="quick-abbreviations-save" type="button" class="quick-secondary-button">保存</button></div></div></details>
    <p class="quick-privacy">数値は伏せて送ります。社名・人名と文章はMicrosoft 365 Copilotへそのまま送ります。</p>
  </main>
</body>
</html>
