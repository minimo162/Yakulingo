<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="yaku-session" content="__YAKU_SESSION_TOKEN__"><meta name="yaku-max-batch-chars" content="__YAKU_MAX_BATCH_CHARS__"><title>文章を翻訳 - YakuLingo</title><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/quick-page.css"><script src="/assets/common.js" defer></script><script src="/assets/quick-page.js" defer></script></head>
<body class="app-quick"><header class="quick-topbar"><a class="quick-brand" href="/cat"><span aria-hidden="true">Y</span><strong>YakuLingo</strong></a><nav class="quick-mode-nav" aria-label="翻訳モード"><a href="/quick" aria-current="page">文章を翻訳</a><a href="/cat">Excelを翻訳</a></nav><div class="quick-copilot"><div id="copilot-status" class="status" aria-live="polite"><span class="status-dot warn"></span><span>準備しています</span></div><button id="copilot-window-open" type="button" class="link-button">Copilot画面を開く</button><button id="copilot-prepare-retry" type="button" class="link-button" hidden>準備し直す</button></div></header><p id="copilot-status-detail" class="quick-copilot-detail" role="status" aria-live="polite" hidden></p>
<main class="quick-main"><div class="quick-heading"><span>短文・セル向け</span><h1>文章を翻訳</h1><p>自然な訳を作り、必要なら表示条件に合わせて短くできます。</p></div><div id="quick-handoff-note" class="quick-handoff-note" hidden><strong>Excelから引き継ぎました</strong><span id="quick-handoff-cell"></span></div>
<form id="quick-page-form" class="quick-panes"><section class="quick-pane quick-source-pane" aria-labelledby="quick-source-title"><div class="quick-pane-head"><label id="quick-source-title" for="quick-page-input">原文</label><select id="quick-page-direction" aria-label="翻訳方向"><option value="auto">自動判定</option><option value="to_en">日本語 → 英語</option><option value="to_jp">英語 → 日本語</option></select></div><textarea id="quick-page-input" rows="14" placeholder="翻訳する文章を入力してください" spellcheck="true" autocomplete="off"></textarea><div class="quick-pane-foot"><span id="quick-page-count">0字</span><span id="quick-page-limit" role="status"></span></div>
<details id="quick-display-details" class="quick-display-details"><summary>表示条件（必要なときだけ）</summary><p>Excelの厳密な描画ではなく、短くするための目安です。</p><div class="quick-condition-grid"><label>用途<select id="quick-purpose"><option value="body">本文</option><option value="heading">見出し</option><option value="table">表</option><option value="excel_cell">Excelセル</option></select></label><label>短さ<select id="quick-length"><option value="natural">自然</option><option value="short">短め</option><option value="very_short">かなり短い</option><option value="shortest">最短</option></select></label><label>フォント<input id="quick-font" type="text" maxlength="80" placeholder="例: Arial"></label><label>文字サイズ<input id="quick-font-size" type="number" min="6" max="72" step="0.5" placeholder="pt"></label><label>Excel列幅<input id="quick-column-width" type="number" min="1" max="255" step="0.1"></label><label>行数の目安<input id="quick-lines" type="number" min="1" max="50"></label><label>目標文字数<input id="quick-target-chars" type="number" min="1" max="3000"></label><label>短縮率<input id="quick-percent" type="number" min="1" max="90" placeholder="%"></label><label class="quick-check"><input id="quick-wrap" type="checkbox" checked>折り返しあり</label><label class="quick-check"><input id="quick-merged" type="checkbox">結合セル</label></div><label class="quick-preserve-label" for="quick-preserve">維持する固有名詞（任意）</label><input id="quick-preserve" type="text" maxlength="300" placeholder="製品名・社名など。数字と単位は常に維持します"></details>
<div class="quick-submit-row"><span id="quick-page-direction-note" role="status">翻訳方向は自動で判定します</span><button id="quick-page-submit" type="submit" disabled>翻訳</button></div></section>
<section class="quick-pane quick-target-pane" aria-labelledby="quick-target-title"><div class="quick-pane-head"><span id="quick-target-title">訳文</span><button id="quick-page-copy" type="button" class="secondary-button" disabled>コピー</button></div><div id="quick-variants" class="quick-variants" aria-label="翻訳案" hidden></div><div class="quick-output-wrap"><textarea id="quick-page-output" rows="14" readonly placeholder="訳文がここに表示されます"></textarea><div id="quick-page-progress" class="quick-progress" role="status" aria-live="polite" hidden></div></div><div id="quick-result-meta" class="quick-result-meta" hidden><span id="quick-result-count"></span><span id="quick-fit-estimate"></span></div><div id="quick-rewrite-actions" class="quick-rewrite-actions" hidden><button type="button" data-quick-chip="shorten">短くする</button><button type="button" data-quick-chip="shorter">さらに短く</button><button type="button" data-quick-chip="rephrase">意味を保って言い換える</button><button type="button" data-quick-chip="heading">見出し向け</button><button type="button" data-quick-chip="table">表・セル向け</button><button id="quick-page-undo" type="button" class="link-button" disabled>直前の案へ戻す</button></div><div class="quick-pane-foot"><span id="quick-page-status" role="status" aria-live="polite"></span><div class="quick-result-actions"><button id="quick-page-return" type="button" class="secondary-button" hidden>Excel作業へ戻す</button><button id="quick-page-cancel" type="button" class="link-button" hidden>中止</button><button id="quick-page-retry" type="button" class="link-button" hidden>再試行</button></div></div></section></form><p class="quick-privacy">表示条件は翻訳最適化の目安であり、Excelで必ず収まることを保証しません。数値は伏せて送ります。社名・人名と文章はそのまま送ります。</p></main></body></html>
