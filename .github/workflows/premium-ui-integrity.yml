name: Premium UI integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  premium-ui-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install browser test dependencies
        shell: powershell
        run: npm ci

      - name: Install Chromium for browser contract
        shell: powershell
        run: npm run install-chromium

      - name: Test premium specialized UI
        shell: powershell
        run: .\app\tools\Test-YakuPremiumUi.ps1

      - name: Test issues 175-188 contracts
        shell: powershell
        run: node .\app\tools\Test-YakuIssues175To188.mjs
