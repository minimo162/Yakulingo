name: Patch premium UI observer

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  patch-observer:
    if: github.event.label.name == 'premium-ui-observer-fix'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: codex/premium-specialized-ui
          fetch-depth: 2

      - name: Replace broad workspace observer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'V91.61/app/www/assets/premium-ui.js'
          $text = [IO.File]::ReadAllText($path, [Text.Encoding]::UTF8)
          $old = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          $new = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "PREMIUM_OBSERVER_PATCH_COUNT_INVALID: $count" }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($true)))
          node --check $path
          if ($LASTEXITCODE -ne 0) { throw "PREMIUM_OBSERVER_NODE_CHECK_FAILED: $LASTEXITCODE" }
          .\V91.61\app\tools\Test-YakuPremiumUi.ps1
          .\V91.61\app\tools\Check-Encoding.ps1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $path
          git diff --cached --check
          git commit -m 'Avoid premium UI self-refresh loop'
          git push origin HEAD:codex/premium-specialized-ui
