name: Windows integrity

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-publication-fit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: codex/publication-fit-remeasure
          fetch-depth: 2

      - name: Patch publication fit measurement
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $catPath = 'V91.61/app/www/assets/cat.js'
          $text = [IO.File]::ReadAllText($catPath, [Text.Encoding]::UTF8)

          $fitTextPattern = "(?ms)^  function segmentFitText\(segment\) \{\r?\n    var target = String\(segment\.translation \|\| ''\);\r?\n    return target\.trim\(\) \? target : String\(segment\.source \|\| ''\);\r?\n  \}"
          if ([regex]::Matches($text, $fitTextPattern).Count -ne 1) { throw 'SEGMENT_FIT_TEXT_PATTERN_COUNT_INVALID' }
          $fitTextReplacement = @(
            '  function segmentFitText(segment) {',
            '    /* Measure the actual publication text after a concise variant is adopted.',
            '       Keep the canonical translation intact; fit checks prefer publication_translation. */',
            "    var publication = String(segment && segment.publication_translation || '');",
            '    if (publication.trim()) return publication;',
            "    var target = String(segment && segment.translation || '');",
            "    return target.trim() ? target : String(segment && segment.source || '');",
            '  }'
          ) -join "`n"
          $text = [regex]::Replace($text, $fitTextPattern, $fitTextReplacement, 1)

          $capacityPattern = "(?m)^    var text = String\(segment\.translation \|\| ''\);\r?\n    if \(!text\) return null;$"
          if ([regex]::Matches($text, $capacityPattern).Count -ne 1) { throw 'SEGMENT_FIT_CAPACITY_PATTERN_COUNT_INVALID' }
          $text = [regex]::Replace($text, $capacityPattern, "    var text = segmentFitText(segment);`n    if (!text.trim()) return null;", 1)

          $budgetPattern = "(?m)^    var maxChars = measuredCapacity \? measuredCapacity\.maxChars : Math\.max\(20, Math\.floor\(String\(segment\.translation \|\| ''\)\.length \* 0\.8\)\);$"
          if ([regex]::Matches($text, $budgetPattern).Count -ne 1) { throw 'COMPUTE_FIT_BUDGET_PATTERN_COUNT_INVALID' }
          $text = [regex]::Replace($text, $budgetPattern, "    var currentText = segmentFitText(segment);`n    var maxChars = measuredCapacity ? measuredCapacity.maxChars : Math.max(20, Math.floor(currentText.length * 0.8));", 1)

          if ($text -notmatch "if \(!String\(segment\.translation \|\| ''\)\.trim\(\)\) return \{ risk: false \};") { throw 'UNTRANSLATED_FIT_GATE_LOST' }
          [IO.File]::WriteAllText($catPath, $text, (New-Object Text.UTF8Encoding($true)))

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $catPath
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'CAT_JS_DIFF_CHECK_FAILED' }
          git commit -m 'Remeasure adopted publication translations'
          if ($LASTEXITCODE -ne 0) { throw 'CAT_JS_COMMIT_FAILED' }
          git push origin HEAD:codex/publication-fit-remeasure
          if ($LASTEXITCODE -ne 0) { throw 'CAT_JS_PUSH_FAILED' }
