name: Apply premium specialized UI

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  apply-premium-ui:
    if: github.event.label.name == 'premium-ui-apply'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: codex/premium-specialized-ui
          fetch-depth: 2

      - name: Materialize and verify premium UI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function Read-YakuPayload {
            param([Parameter(Mandatory=$true)][string]$Pattern)
            $parts = @(Get-ChildItem -LiteralPath '.premium-payload' -File | Where-Object { $_.Name -like $Pattern } | Sort-Object Name)
            if ($parts.Count -lt 1) { throw "PREMIUM_PAYLOAD_MISSING: $Pattern" }
            return (@($parts | ForEach-Object { [IO.File]::ReadAllText($_.FullName, [Text.Encoding]::ASCII) }) -join '')
          }

          function ConvertFrom-YakuUtf8Base64 {
            param([Parameter(Mandatory=$true)][string]$Value)
            return [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($Value))
          }

          function Expand-YakuPayload {
            param(
              [Parameter(Mandatory=$true)][string]$Base64,
              [Parameter(Mandatory=$true)][string]$Destination
            )
            $compressed = [Convert]::FromBase64String($Base64)
            $input = New-Object IO.MemoryStream(,$compressed)
            $gzip = New-Object IO.Compression.GzipStream($input, [IO.Compression.CompressionMode]::Decompress)
            $output = New-Object IO.MemoryStream
            try { $gzip.CopyTo($output) }
            finally { $gzip.Dispose(); $input.Dispose() }
            $bytes = $output.ToArray(); $output.Dispose()
            $parent = Split-Path -Parent $Destination
            if (-not (Test-Path -LiteralPath $parent -PathType Container)) { $null = New-Item -ItemType Directory -Path $parent -Force }
            [IO.File]::WriteAllBytes($Destination, $bytes)
          }

          function Replace-YakuOnce {
            param(
              [Parameter(Mandatory=$true)][string]$Text,
              [Parameter(Mandatory=$true)][string]$Old,
              [Parameter(Mandatory=$true)][string]$New,
              [Parameter(Mandatory=$true)][string]$Code
            )
            $first = $Text.IndexOf($Old, [StringComparison]::Ordinal)
            if ($first -lt 0) { throw "$Code`_MISSING" }
            $second = $Text.IndexOf($Old, $first + $Old.Length, [StringComparison]::Ordinal)
            if ($second -ge 0) { throw "$Code`_DUPLICATE" }
            return $Text.Substring(0, $first) + $New + $Text.Substring($first + $Old.Length)
          }

          function Update-YakuPage {
            param(
              [Parameter(Mandatory=$true)][string]$Path,
              [Parameter(Mandatory=$true)][string]$OldTitle,
              [Parameter(Mandatory=$true)][string]$NewTitle,
              [Parameter(Mandatory=$true)][string]$BaseCss,
              [Parameter(Mandatory=$true)][string]$BaseJs
            )
            $text = [IO.File]::ReadAllText($Path, [Text.Encoding]::UTF8)
            $nl = if ($text.Contains("`r`n")) { "`r`n" } else { "`n" }
            if ($text.Contains($OldTitle)) {
              $text = Replace-YakuOnce -Text $text -Old $OldTitle -New $NewTitle -Code 'PREMIUM_TITLE'
            } elseif (-not $text.Contains($NewTitle)) {
              throw 'PREMIUM_TITLE_STATE_INVALID'
            }
            $premiumCss = '  <link rel="stylesheet" href="/assets/premium-ui.css">'
            if (-not $text.Contains('/assets/premium-ui.css')) {
              $text = Replace-YakuOnce -Text $text -Old $BaseCss -New ($BaseCss + $nl + $premiumCss) -Code 'PREMIUM_CSS_ANCHOR'
            }
            $premiumJs = '  <script src="/assets/premium-ui.js" defer></script>'
            if (-not $text.Contains('/assets/premium-ui.js')) {
              $text = Replace-YakuOnce -Text $text -Old $BaseJs -New ($BaseJs + $nl + $premiumJs) -Code 'PREMIUM_JS_ANCHOR'
            }
            [IO.File]::WriteAllText($Path, $text, (New-Object Text.UTF8Encoding($true)))
          }

          Expand-YakuPayload -Base64 (Read-YakuPayload -Pattern 'js-*') -Destination 'V91.61/app/www/assets/premium-ui.js'
          Expand-YakuPayload -Base64 (Read-YakuPayload -Pattern 'css-*') -Destination 'V91.61/app/www/assets/premium-ui.css'
          Expand-YakuPayload -Base64 (Read-YakuPayload -Pattern 'test-*') -Destination 'V91.61/app/tools/Test-YakuPremiumUi.ps1'

          $catOldTitle = ConvertFrom-YakuUtf8Base64 'PHRpdGxlPue/u+iosyAtIFlha3VMaW5nbzwvdGl0bGU+'
          $catNewTitle = ConvertFrom-YakuUtf8Base64 'PHRpdGxlPkV4Y2Vs57+76KizIC0gWWFrdUxpbmdvPC90aXRsZT4='
          $paletteOldTitle = ConvertFrom-YakuUtf8Base64 'PHRpdGxlPuOBiuaJi+i7vee/u+iosyAtIFlha3VMaW5nbzwvdGl0bGU+'
          $paletteNewTitle = ConvertFrom-YakuUtf8Base64 'PHRpdGxlPuOCr+OCpOODg+OCr+e/u+iosyAtIFlha3VMaW5nbzwvdGl0bGU+'
          Update-YakuPage -Path 'V91.61/app/www/cat.html' -OldTitle $catOldTitle -NewTitle $catNewTitle -BaseCss '  <link rel="stylesheet" href="/assets/cat-workspace.css">' -BaseJs '  <script src="/assets/cat.js" defer></script>'
          Update-YakuPage -Path 'V91.61/app/www/palette.html' -OldTitle $paletteOldTitle -NewTitle $paletteNewTitle -BaseCss '  <link rel="stylesheet" href="/assets/palette.css">' -BaseJs '  <script src="/assets/palette.js" defer></script>'

          $baselinePath = 'V91.61/app/tools/eol-baseline.txt'
          $baseline = [IO.File]::ReadAllText($baselinePath, [Text.Encoding]::UTF8)
          $baselineNl = if ($baseline.Contains("`r`n")) { "`r`n" } else { "`n" }
          if ($baseline.Length -gt 0 -and -not $baseline.EndsWith("`n")) { $baseline += $baselineNl }
          foreach ($entry in @(
            "tools/Test-YakuPremiumUi.ps1`tlf",
            "www/assets/premium-ui.css`tlf",
            "www/assets/premium-ui.js`tlf"
          )) {
            $pathOnly = ($entry -split "`t", 2)[0]
            if ($baseline -notmatch ('(?m)^' + [regex]::Escape($pathOnly) + "`t")) { $baseline += $entry + $baselineNl }
          }
          [IO.File]::WriteAllText($baselinePath, $baseline, (New-Object Text.UTF8Encoding($true)))

          node --check V91.61/app/www/assets/premium-ui.js
          if ($LASTEXITCODE -ne 0) { throw "PREMIUM_UI_NODE_CHECK_FAILED: $LASTEXITCODE" }
          .\V91.61\app\tools\Test-YakuPremiumUi.ps1
          .\V91.61\app\tools\Check-Encoding.ps1

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- V91.61/app/www/cat.html V91.61/app/www/palette.html V91.61/app/www/assets/premium-ui.js V91.61/app/www/assets/premium-ui.css V91.61/app/tools/Test-YakuPremiumUi.ps1 V91.61/app/tools/eol-baseline.txt
          git diff --cached --check
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'Premium UI is already materialized.'; exit 0 }
          git commit -m 'Implement premium specialized UI'
          git push origin HEAD:codex/premium-specialized-ui
